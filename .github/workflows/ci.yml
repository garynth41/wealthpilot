# Cresari CI — every push and pull request: typecheck, unit tests, build, Playwright smoke (desktop + phone, contrast + axe guards),
# every migration and the SQL tests on a plain Postgres (0.25.1), then the same app built against the staging database and driven end to
# end (0.25.0). A push to main that passes all three publishes
# dist/ to gh-pages (the same thing `npm run deploy` does by hand). The Android and iOS apps are built from the same web build on every
# run too (0.25.1), so a change that breaks either phone app is caught here; they do not hold up the website. Store builds are made
# by release-apps.yml. Dependabot pull requests with passing minor/patch updates merge and deploy by themselves (only once the phone
# apps build as well); majors wait for a person.
name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# read-only by default; only the deploy job (and Dependabot's auto-merge) get to write (0.25.1)
permissions: { contents: read }
env:
  MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # the public Supabase URL / publishable key live in .env.example (the real .env is git-ignored); without them the build has no backend
      - run: cp .env.example .env
      - run: npm run engines:sync -- --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built bundle must carry the Supabase project URL
        run: grep -rl "dshswfcpovdpxcidolqb.supabase.co" dist/assets/*.js > /dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-shots
          path: e2e/shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: env.MAIN_PUSH == 'true'
        with:
          name: dist
          path: dist
          retention-days: 3
  # every migration on a plain Postgres (0.25.1): they must run in order on an empty database and the newest must run twice, then the SQL
  # tests in supabase/tests check account deletion, the membership and alert guards and the account-number scrub (scripts/db-test.mjs).
  # Needs no secrets and never touches staging or production — it catches a broken migration before anyone is asked to apply it.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run db:test
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
  # the app against a real database: RLS, triggers and functions as production has them (migrations applied to staging first)
  staging:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the secrets go only to the steps that use them (not to npm install, Playwright's installer or the other tools)
    steps:
      - name: Skip when the staging secrets are not set
        id: gate
        env: { HAS: "${{ secrets.STAGING_URL != '' && secrets.STAGING_E2E_PASSWORD != '' }}" }
        run: if [ "$HAS" != true ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "::warning::staging secrets not set — database tests skipped"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.gate.outputs.run == 'true'
      - name: Build against staging
        if: steps.gate.outputs.run == 'true'
        env: { STAGING_URL: "${{ secrets.STAGING_URL }}", STAGING_KEY: "${{ secrets.STAGING_KEY }}" }
        run: VITE_SUPABASE_URL="$STAGING_URL" VITE_SUPABASE_KEY="$STAGING_KEY" VITE_APP_NAME=Cresari npx vite build --outDir dist-staging
      - run: npx playwright install --with-deps chromium
        if: steps.gate.outputs.run == 'true'
      - run: npm run e2e:db
        if: steps.gate.outputs.run == 'true'
        env: { STAGING_URL: "${{ secrets.STAGING_URL }}", STAGING_KEY: "${{ secrets.STAGING_KEY }}", STAGING_E2E_PASSWORD: "${{ secrets.STAGING_E2E_PASSWORD }}" }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: staging-shots
          path: e2e/shots
          if-no-files-found: ignore
  # the phone apps (0.25.1): a debug Android build and an iOS simulator build, unsigned — proves the native projects, the plugins and the
  # web build still fit together. Signed store builds come from release-apps.yml.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: cp .env.example .env
      - run: npm run native:sync -- android
      - name: Build the Android app (debug)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cp .env.example .env
      - run: npm run native:sync -- ios
      - name: Use the newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build the iOS app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -40
  deploy:
    needs: [check, database, staging]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }   # pushes to gh-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish dist/ to gh-pages
        run: |
          git config user.name "wealthpilot-ci"; git config user.email "ci@users.noreply.github.com"
          npx --yes gh-pages@6 -d dist --add --dotfiles --nojekyll -u "wealthpilot-ci <ci@users.noreply.github.com>" -m "ci: deploy ${GITHUB_SHA::7}" -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
  # Dependabot: a passing minor or patch update merges itself, then deploys (a merge made with GITHUB_TOKEN does not start a push run,
  # so this job starts the main run itself). Majors are left for a person to review.
  automerge:
    needs: [check, database, staging, android, ios]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, actions: write }
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge and deploy minor / patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", PR: "${{ github.event.pull_request.html_url }}" }
        run: |
          gh pr merge "$PR" --squash --delete-branch
          gh workflow run ci.yml --ref main --repo "${{ github.repository }}"
      - name: Major update — leave for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", PR: "${{ github.event.pull_request.html_url }}" }
        run: gh pr comment "$PR" --body "Major version update — the checks ran; it waits for a person to review and merge."
